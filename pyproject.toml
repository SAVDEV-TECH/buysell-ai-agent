[project]
name = "buysell-ai-agent"
version = "0.1.0"
description = "Enterprise-grade BuySell AI Business Agent"
authors = [{name = "Top Developer"}]
dependencies = [
    "google-genai>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlmodel>=0.0.18",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buysell_agent"]
