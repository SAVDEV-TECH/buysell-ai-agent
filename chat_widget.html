<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BuySell AI Agent — Chat Widget</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* ── Widget container ── */
    #buysell-widget {
      width: 420px;
      max-width: 98vw;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.14);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .widget-header {
      background: linear-gradient(135deg, #1a6b3c 0%, #27ae60 100%);
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .widget-header .avatar {
      width: 42px; height: 42px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .widget-header .info h3 { font-size: 15px; font-weight: 600; }
    .widget-header .info p  { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    .status-dot {
      width: 8px; height: 8px;
      background: #5fffaa;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 380px;
      max-height: 420px;
      background: #f7f9fc;
    }

    .msg {
      display: flex;
      gap: 8px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

    .msg.user  { flex-direction: row-reverse; }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .msg.agent .bubble {
      background: #fff;
      border: 1px solid #e4e8f0;
      border-radius: 4px 16px 16px 16px;
      color: #1a1a2e;
    }
    .msg.user .bubble {
      background: #1a6b3c;
      color: #fff;
      border-radius: 16px 4px 16px 16px;
    }

    /* ── Typing indicator ── */
    .typing-indicator {
      display: flex; gap: 4px;
      align-items: center;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid #e4e8f0;
      border-radius: 4px 16px 16px 16px;
      width: fit-content;
    }
    .typing-indicator span {
      width: 7px; height: 7px;
      background: #aab;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* ── Quick replies ── */
    #quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 16px 0;
    }
    .quick-btn {
      background: #eaf4ee;
      color: #1a6b3c;
      border: 1px solid #c3e6ce;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .quick-btn:hover { background: #1a6b3c; color: #fff; }

    /* ── Input ── */
    .widget-input {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid #eee;
      background: #fff;
    }
    #user-input {
      flex: 1;
      border: 1.5px solid #e0e4ec;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #user-input:focus { border-color: #1a6b3c; }

    #send-btn {
      width: 42px; height: 42px;
      background: #1a6b3c;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }
    #send-btn:hover  { background: #145c31; }
    #send-btn:active { transform: scale(0.93); }
    #send-btn svg { width: 18px; height: 18px; fill: #fff; }

    .powered-by {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      padding: 6px 0 10px;
    }
  </style>
</head>
<body>

<div id="buysell-widget">

  <!-- Header -->
  <div class="widget-header">
    <div class="avatar">🛒</div>
    <div class="info">
      <h3>BuySell AI Agent</h3>
      <p><span class="status-dot"></span>Online — here to help</p>
    </div>
  </div>

  <!-- Messages -->
  <div id="messages">
    <div class="msg agent">
      <div class="bubble">Hello! I'm the BuySell AI Agent. I can help you search products, check prices, compare suppliers, place orders, and generate payment links. How can I help you today?</div>
    </div>
  </div>

  <!-- Quick reply chips -->
  <div id="quick-replies">
    <button class="quick-btn" onclick="quickSend('Find me Indomie Noodles')">🔍 Search products</button>
    <button class="quick-btn" onclick="quickSend('Compare suppliers for Dangote Sugar')">🏭 Compare suppliers</button>
    <button class="quick-btn" onclick="quickSend('Show me all my orders')">📦 My orders</button>
    <button class="quick-btn" onclick="quickSend('Generate a quote for 100 units of Indomie Noodles')">📄 Get a quote</button>
  </div>

  <!-- Input -->
  <div class="widget-input">
    <input id="user-input" type="text" placeholder="Ask me anything..." autocomplete="off" />
    <button id="send-btn" onclick="sendMessage()" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>

  <p class="powered-by">Powered by Gemini AI &amp; BuySell Agent</p>
</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────
  // Replace this with your Railway deployment URL after deploying
  const API_BASE = "http://localhost:8000";
  const SESSION_ID = "session-" + Math.random().toString(36).slice(2, 9);
  // ────────────────────────────────────────────────────────────────────────

  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("user-input");

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function quickSend(text) {
    inputEl.value = text;
    sendMessage();
  }

  function appendMessage(role, text) {
    const msg = document.createElement("div");
    msg.className = `msg ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function showTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg agent";
    wrap.id = "typing";
    wrap.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typing");
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";

    appendMessage("user", text);
    showTyping();

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: SESSION_ID }),
      });

      const data = await res.json();
      removeTyping();

      if (res.ok) {
        appendMessage("agent", data.reply);
      } else {
        appendMessage("agent", "Sorry, something went wrong. Please try again.");
      }
    } catch (err) {
      removeTyping();
      appendMessage("agent", "Cannot reach the BuySell agent. Please check the server.");
    }
  }
</script>

</body>
</html>
